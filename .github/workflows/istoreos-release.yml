name: iStoreOS Docker release

on:
  workflow_dispatch:
    inputs:
      release_bump:
        description: "版本递增类型；按实际兼容性影响选择"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      release_notes:
        description: "本版优化与新增内容，每行一项；留空时按提交记录生成"
        required: false
        type: string

concurrency:
  group: qidian-manual-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify publishing secrets
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: |
          test -n "$DOCKERHUB_TOKEN" || { echo "Repository secret DOCKERHUB_TOKEN is required." >&2; exit 1; }
          test -n "$RELEASE_PUBLISH_TOKEN" || { echo "Repository secret RELEASE_PUBLISH_TOKEN is required." >&2; exit 1; }
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Select or resume release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUMP: ${{ inputs.release_bump }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node scripts/release-version.mjs "$RELEASE_BUMP")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify source
        run: |
          pnpm check
          pnpm test
          pnpm build
      - name: Prepare OpenWrt package feed
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p artifacts/openwrt-ipk artifacts/openwrt-apk artifacts/istoreos
          printf '%s\n' "$VERSION" > packaging/istoreos/VERSION
      - name: Build native OpenWrt IPK package
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64-24.10.7
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/openwrt-ipk
          FEED_DIR: ${{ github.workspace }}/packaging/istoreos
          FEEDNAME: qidian
          PACKAGES: luci-app-qidian
          BUILD_LOG: 1
          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1
          V: s
      - name: Build native OpenWrt APK package
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64-25.12.5
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/openwrt-apk
          FEED_DIR: ${{ github.workspace }}/packaging/istoreos
          FEEDNAME: qidian
          PACKAGES: luci-app-qidian
          BUILD_LOG: 1
          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1
          V: s
      - name: Upload OpenWrt SDK logs after failed package build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-sdk-build-logs
          path: |
            artifacts/openwrt-ipk/logs/
            artifacts/openwrt-apk/logs/
          if-no-files-found: warn
          retention-days: 3
      - name: Collect and checksum OpenWrt packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          ipk=$(find artifacts/openwrt-ipk/bin/packages -type f -name 'luci-app-qidian_*.ipk' -print -quit)
          apk=$(find artifacts/openwrt-apk/bin/packages -type f -name 'luci-app-qidian-*.apk' -print -quit)
          test -n "$ipk" && test -f "$ipk"
          test -n "$apk" && test -f "$apk"
          cp "$ipk" "artifacts/istoreos/luci-app-qidian_${VERSION}_all.ipk"
          cp "$apk" "artifacts/istoreos/luci-app-qidian-${VERSION}.apk"
          (cd artifacts/istoreos && sha256sum "luci-app-qidian_${VERSION}_all.ipk" > "luci-app-qidian_${VERSION}_all.ipk.sha256")
          (cd artifacts/istoreos && sha256sum "luci-app-qidian-${VERSION}.apk" > "luci-app-qidian-${VERSION}.apk.sha256")
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          build-args: |
            QIDIAN_VERSION=${{ steps.version.outputs.version }}
          tags: qidian-selfhost:release
          cache-from: type=gha,scope=qidian-image
      - name: Smoke-test self-hosted container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name qidian-smoke -p 127.0.0.1:9908:9908 \
            --tmpfs /data:uid=1000,gid=1000 \
            -e REGISTRATION_ENABLED=false qidian-selfhost:release
          cleanup() { docker rm -f qidian-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9908/healthz >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:9908/ >/dev/null
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:9908/api/vault)
          test "$status" = 401 || { docker logs qidian-smoke; echo "Expected unauthenticated API status 401, got $status" >&2; exit 1; }
      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: luckyalanzhou
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish multi-architecture Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            QIDIAN_VERSION=${{ steps.version.outputs.version }}
          tags: |
            docker.io/luckyalanzhou/qidian:${{ steps.version.outputs.version }}
            docker.io/luckyalanzhou/qidian:latest
          cache-from: type=gha,scope=qidian-image
          cache-to: type=gha,mode=max,scope=qidian-image
      - name: Install Makeself
        run: sudo apt-get update && sudo apt-get install --yes makeself
      - name: Check packaging scripts
        run: |
          bash -n packaging/istoreos/build-run.sh
          sh -n packaging/istoreos/install.sh
          sh -n packaging/istoreos/luci-app-qidian/root/usr/libexec/istorec/qidian.sh
          sh -n packaging/istoreos/luci-app-qidian/root/usr/libexec/istorec/qidian-updater.sh
      - name: Build iStoreOS package
        run: bash packaging/istoreos/build-run.sh artifacts/istoreos
      - name: Prepare release checksum with the public asset name
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd artifacts/istoreos
          sha256sum --check "qidian-${VERSION}.run.sha256"
          digest=$(sha256sum "qidian-${VERSION}.run" | cut -d ' ' -f1)
          printf '%s  栖点-%s.run\n' "$digest" "$VERSION" > "qidian-${VERSION}.run.release.sha256"
          test "$(awk '{print $1}' "qidian-${VERSION}.run.release.sha256")" = "$digest"
      - name: Verify self-extracting archive checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sh "artifacts/istoreos/qidian-${VERSION}.run" --check
          (cd artifacts/istoreos && sha256sum --check "qidian-${VERSION}.run.sha256")
          (cd artifacts/istoreos && sha256sum --check "luci-app-qidian_${VERSION}_all.ipk.sha256")
          (cd artifacts/istoreos && sha256sum --check "luci-app-qidian-${VERSION}.apk.sha256")
      - name: Commit version bump to main
        id: release_commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "luckyalanzhou"
          git config user.email "zhiminzhou1@gmail.com"
          git add package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: release v${VERSION}"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RELEASE_EXISTS: ${{ steps.version.outputs.release_exists }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ steps.release_commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          version="$VERSION"
          tag="v${version}"
          title="栖点 ${version} · iStoreOS Docker"
          notes_file=$(mktemp)
          details="$RELEASE_NOTES"
          if [ -z "$(printf '%s' "$details" | tr -d '[:space:]')" ]; then
            previous_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
            if [ -n "$previous_tag" ]; then
              details=$(git log --reverse --format='%s' "${previous_tag}..HEAD^" --invert-grep --grep='^chore: release ')
            else
              details=$(git log -1 --format='%s' HEAD^)
            fi
          fi
          {
            printf '## 本版优化与新增\n\n'
            item=0
            while IFS= read -r detail || [ -n "$detail" ]; do
              [ -n "$detail" ] || continue
              case "$detail" in
                feat:\ *) detail=${detail#feat: } ;;
                fix:\ *) detail=${detail#fix: } ;;
                chore:\ *) detail=${detail#chore: } ;;
              esac
              numbered_prefix='^[[:space:]]*[0-9]+[.)][[:space:]]+'
              bullet_prefix='^[[:space:]]*[-+*][[:space:]]+'
              while [[ "$detail" =~ $numbered_prefix ]] || [[ "$detail" =~ $bullet_prefix ]]; do
                prefix=${BASH_REMATCH[0]}
                detail=${detail#"$prefix"}
              done
              item=$((item + 1))
              printf '%d. %s\n' "$item" "$detail"
            done < <(printf '%s\n' "$details")
            if [ "$item" -eq 0 ]; then printf '1. 完成本版维护与兼容性优化。\n'; fi
            printf '\n## 安装包\n\n'
            printf -- '- iStoreOS Docker 安装包 v%s。\n' "$version"
            printf -- '- OpenWrt 24.10（opkg）：`luci-app-qidian_%s_all.ipk`。\n' "$version"
            printf -- '- OpenWrt 25.12（apk）：`luci-app-qidian-%s.apk`。\n' "$version"
            printf -- '- Docker Hub 多架构镜像：`luckyalanzhou/qidian:%s`（amd64 / arm64）。\n' "$version"
            printf -- '- 源码版本已自动递增并提交到 `main`。\n'
          } > "$notes_file"
          if [ "$RELEASE_EXISTS" = "true" ]; then
            tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha' 2>/dev/null || true)
            if [ "$tag_sha" != "$TARGET_SHA" ]; then
              if [ -n "$tag_sha" ]; then
                gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" -f sha="$TARGET_SHA" -F force=true >/dev/null
              else
                gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${tag}" -f sha="$TARGET_SHA" >/dev/null
              fi
            fi
          fi
          if [ "$RELEASE_EXISTS" != "true" ]; then
            gh release create "$tag" --draft --target "$TARGET_SHA" --title "$title" --notes-file "$notes_file"
          fi
          gh release upload "$tag" \
            "artifacts/istoreos/qidian-${version}.run#栖点-${version}.run" \
            "artifacts/istoreos/qidian-${version}.run.release.sha256#栖点-${version}.run.sha256" \
            "artifacts/istoreos/luci-app-qidian_${version}_all.ipk" \
            "artifacts/istoreos/luci-app-qidian_${version}_all.ipk.sha256" \
            "artifacts/istoreos/luci-app-qidian-${version}.apk" \
            "artifacts/istoreos/luci-app-qidian-${version}.apk.sha256" \
            --clobber
          assets=$(gh release view "$tag" --json assets --jq '.assets[] | (.label // .name)')
          for expected in "栖点-${version}.run" "栖点-${version}.run.sha256"; do
            printf '%s\n' "$assets" | grep -Fqx "$expected" || {
              echo "Release asset missing after upload: $expected" >&2
              exit 1
            }
          done
          for expected in \
            "luci-app-qidian_${version}_all.ipk" \
            "luci-app-qidian_${version}_all.ipk.sha256" \
            "luci-app-qidian-${version}.apk" \
            "luci-app-qidian-${version}.apk.sha256"; do
            printf '%s\n' "$assets" | grep -Fqx "$expected" || {
              echo "Release asset missing after upload: $expected" >&2
              exit 1
            }
          done
          gh release edit "$tag" --title "$title" --notes-file "$notes_file" --draft=false --latest
