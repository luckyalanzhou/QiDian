name: Verify and build iStoreOS installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify source
        run: |
          pnpm check
          pnpm test
          pnpm build

      - name: Build and smoke-test Docker image
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          docker build --pull --build-arg "QIDIAN_VERSION=$version" -t qidian-selfhost:ci .
          docker run -d --name qidian-smoke -p 127.0.0.1:9908:9908 \
            --tmpfs /data:uid=1000,gid=1000 \
            -e REGISTRATION_ENABLED=false qidian-selfhost:ci
          cleanup() { docker rm -f qidian-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9908/readyz >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:9908/ >/dev/null
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:9908/api/vault)
          test "$status" = 401 || { docker logs qidian-smoke; echo "Expected unauthenticated API status 401, got $status" >&2; exit 1; }

      - name: Install Makeself
        run: sudo apt-get update && sudo apt-get install --yes makeself

      - name: Check packaging scripts
        run: |
          bash -n packaging/istoreos/build-run.sh
          sh -n packaging/istoreos/install.sh
          sh -n packaging/istoreos/luci-app-qidian/root/usr/libexec/istorec/qidian.sh
          sh -n packaging/istoreos/luci-app-qidian/root/usr/libexec/istorec/qidian-updater.sh

      - name: Build self-extracting installer
        run: bash packaging/istoreos/build-run.sh artifacts/istoreos

      - name: Verify installer and checksum
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          sh "artifacts/istoreos/qidian-${version}.run" --check
          (cd artifacts/istoreos && sha256sum --check "qidian-${version}.run.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: qidian-istoreos-${{ github.sha }}
          path: artifacts/istoreos/*
          if-no-files-found: error
          retention-days: 14
