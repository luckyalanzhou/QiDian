services:
  qidian:
    image: ${QIDIAN_IMAGE:?请先在LuCI执行安装或更新}
    container_name: qidian
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "9908"
      HOST: 0.0.0.0
      DATA_DIR: /data
      STATIC_DIR: /app/dist
      MIGRATIONS_DIR: /app/migrations
      UPDATE_REQUEST_DIR: /run/qidian-update-inbox
      UPDATE_STATUS_DIR: /run/qidian-update-status
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
    volumes:
      - ${QIDIAN_DATA_PATH:?请先在LuCI执行安装或更新}:/data
      - ${QIDIAN_UPDATE_REQUEST_PATH:?请先在LuCI执行安装或更新}:/run/qidian-update-inbox
      - ${QIDIAN_UPDATE_STATUS_PATH:?请先在LuCI执行安装或更新}:/run/qidian-update-status:ro
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-9908}:9908"
