<section id="loginGate" class="login-gate" aria-labelledby="authTitle">
  <div class="auth-card">
    <div class="auth-brand"><div class="brand-icon">栖</div><div><strong>栖点</strong></div></div>
    <h1 id="authTitle">进入你的知识库</h1>
    <p class="auth-intro">使用账号和密码登录。</p>
    <form id="authForm" novalidate>
      <label class="auth-label" for="authUsername">账号</label>
      <input id="authUsername" name="username" class="auth-input" autocomplete="username" autocapitalize="none" spellcheck="false" minlength="3" maxlength="32" required placeholder="输入账号">
      <label class="auth-label" for="authPassword">密码</label>
      <input id="authPassword" name="password" class="auth-input" type="password" autocomplete="current-password" minlength="8" maxlength="128" required placeholder="请输入密码">
      <p id="authPasswordHint" class="auth-password-hint" hidden>至少 8 位，大小写字母、数字、符号任选两类。</p>
      <div id="authConfirmWrap" hidden>
        <label class="auth-label" for="authPasswordConfirm">再次输入密码</label>
        <input id="authPasswordConfirm" class="auth-input" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="确认密码">
      </div>
      <button id="authSubmit" class="primary-btn auth-submit" type="submit">登录</button>
      <p id="authMessage" class="auth-message" role="status" aria-live="polite"></p>
    </form>
    <div class="auth-links" id="authLinks" aria-label="账号操作" hidden>
      <button class="auth-text-button" id="authRegister" type="button" hidden>注册账号</button>
      <button class="auth-text-button" id="authReturnLogin" type="button" hidden>已有账号？返回登录</button>
    </div>
    <p class="auth-footnote">请妥善保存账号和密码。</p>
  </div>
</section><div class="app" hidden>
<aside class="sidebar" id="sidebar">
  <div id="sidebarBrandIsland"><button class="brand home-brand" id="brandHome" type="button" data-legacy-fallback aria-label="栖点，返回首页"><span class="brand-icon" aria-hidden="true">栖</span><span class="brand-copy"><strong>栖点</strong></span></button></div>
  <div id="sidebarCreateIsland"><button class="new-note" id="newSide" type="button" data-legacy-fallback><span class="ico"><svg><use href="#i-plus"/></svg></span> 新建笔记</button></div>
  <div class="sidebar-scroll" id="qidianSidebarIsland"></div>
</aside>
<div id="mobileShadeIsland"></div>
<div class="workspace"><header class="topbar"><div class="breadcrumb"><span id="mobileMenuButtonIsland"></span><span id="breadcrumbTitleIsland"></span></div><div class="top-actions"><div id="topbarSearchIsland" class="topbar-search-island"><button class="search-btn" id="searchTop" type="button" data-legacy-fallback><span class="ico"><svg><use href="#i-search"/></svg></span><span>搜索你的知识...</span><span class="shortcut">⌘ K</span></button></div><button class="version-trigger" id="versionButton" type="button" aria-label="查看版本信息" title="查看版本信息"><span id="currentVersionLabel">版本</span><span class="version-alert-dot" aria-hidden="true"></span></button><div id="topbarMenusIsland" class="topbar-menus-island"></div></div></header><main class="main" id="main" tabindex="-1"></main><div class="main dashboard-host" id="dashboardHost" role="main" aria-label="我的空间" hidden></div></div>
</div>
<div id="qidianVueIslands"></div>


<input id="importFile" type="file" accept="application/json,.json,application/zip,.zip" hidden><input id="attachmentFile" type="file" multiple hidden>
<input id="imageFile" class="img-input" type="file" accept="image/*" multiple hidden>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="/src/main.ts"></script>

</html>
