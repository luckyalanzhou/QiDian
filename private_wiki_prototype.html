(()=>{'use strict';
const icons=name=>`<span class="ico"><svg aria-hidden="true"><use href="#i-${name}"/></svg></span>`;
const $=sel=>document.querySelector(sel);const main=$('#main');const DB='qid_wiki_v1';const typeName={note:'普通笔记',clip:'网页收藏',command:'命令速查',issue:'故障排查'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tinyText=s=>{let box=document.createElement('div');box.innerHTML=s;return (box.textContent||'').replace(/\s+/g,' ').trim()};
function demoData(){let now=Date.now();const ns=(id,title,category,type,tags,body,days,pinned=false,source='')=>({id,title,category,type,tags,body,updated:now-days*864e5,created:now-days*864e5,pinned,source});return {categories:['网络配置','服务器部署','开发工具','故障排查','网页收藏','生活记录'],notes:[
ns('a1','Cloudflare Pages：部署与绑定域名','服务器部署','note',['Cloudflare','GitHub','部署'],`<p>把静态站点从 GitHub 部署到 Cloudflare Pages。这里整理的是我自己操作时需要的步骤和检查点。</p><div class="callout">📌 <strong>目标：</strong>代码提交后自动部署，并通过自己的域名访问。</div><h2>准备工作</h2><ul><li>一个 GitHub 仓库</li><li>一个 Cloudflare 账户</li><li>待部署的静态网站项目</li></ul><h2>操作步骤</h2><h3>1. 连接 GitHub 仓库</h3><p>在 Cloudflare 控制台创建 Pages 项目，并连接对应仓库。</p><h3>2. 配置构建参数</h3><table><tbody><tr><th>配置项</th><th>示例</th></tr><tr><td>构建命令</td><td><code>npm run build</code></td></tr><tr><td>输出目录</td><td><code>dist</code></td></tr></tbody></table><h3>3. 本地检查构建</h3><pre><code>npm install\nnpm run build</code></pre><h2>验证与注意事项</h2><div class="callout warn">⚠️ 私人知识库不能只依靠私有 GitHub 仓库保护访问。部署后还需要配置身份验证，并检查默认域名与预览地址。</div><details><summary>展开：上线检查清单</summary><ul><li>网页可以加载</li><li>所有附件可访问</li><li>未登录者无法查看内容</li></ul></details>`,0,true),
ns('a2','Nikki DNS 解析问题：排查记录','网络配置','issue',['Nikki','DNS','排查'],`<h2>问题现象</h2><p>部分网页在 Wi-Fi 下出现解析或连接异常，需要确认是 DNS、规则匹配还是上游连接问题。</p><h2>先看结论</h2><div class="callout good">✅ 优先核实 DNS 记录与实际解析结果，再检查代理连接日志，不要一次修改多个配置项。</div><h2>检查命令</h2><pre><code>nslookup example.com 223.5.5.5\nnslookup example.com 1.1.1.1</code></pre><h2>排查过程</h2><ol><li>记录异常出现的时间与设备。</li><li>对比 Wi-Fi 与蜂窝网络。</li><li>检查 DNS 解析结果及代理日志。</li><li>逐项修改并测试，保留可回滚的旧配置。</li></ol>`,1),
ns('a3','Git 常用命令备忘','开发工具','command',['Git','命令'],`<h2>查看状态</h2><pre><code>git status</code></pre><h2>查看当前分支</h2><pre><code>git branch --show-current</code></pre><h2>查看提交记录</h2><pre><code>git log --oneline -10</code></pre><h2>撤销未暂存修改</h2><pre><code>git restore 文件名</code></pre><div class="callout warn">⚠️ 最后一条命令会丢弃对应文件尚未暂存的修改。</div>`,2,true),
ns('a4','值得保留的网页：富文本剪藏示例','网页收藏','clip',['网页','资料','收藏'],`<p>这是一份<strong style="color:#4d60c5">网页富文本收藏示例</strong>。从其他网站复制内容时，标题、文字样式、链接和表格可以尽量保留下来。</p><h2>阅读重点</h2><table><tbody><tr><th>内容</th><th>保存目标</th></tr><tr><td>文字和标题</td><td>维持层级</td></tr><tr><td>图片与说明</td><td>保持顺序</td></tr><tr><td>链接</td><td>保留来源</td></tr></tbody></table><blockquote>粘贴效果取决于原网页提供的剪贴板 HTML，原始页面的脚本、字体和复杂布局不能保证无损复刻。</blockquote><p>还可以在收藏的文章后面直接补充自己的阅读笔记。</p>`,3,false,'https://example.com/article'),
ns('a5','SSH 连接与文件传输','服务器部署','command',['SSH','Linux'],`<h2>SSH 登录</h2><pre><code>ssh user@server.example.com</code></pre><h2>复制本地文件至服务器</h2><pre><code>scp ./file.txt user@server.example.com:/home/user/</code></pre><p>地址与用户名为占位示例，请替换成自己的实际配置。</p>`,4),
ns('a6','Surge 分流规则：结构记录','网络配置','note',['Surge','规则'],`<h2>目标</h2><p>国内优先直连、需要代理的流量选择代理策略组。</p><h2>记录格式</h2><pre><code>[Proxy Group]\nProxy = select, ...\nFinal = select, ...</code></pre><p>正式配置应保存来源、更新时间、适用软件版本和回滚方法。</p>`,5),
ns('a7','一条想法：好笔记要容易再次找到','生活记录','note',['随想'],`<p>记录一条知识只需要几秒。<strong>能搜索到，比排得漂亮更重要。</strong></p><ul><li>尽量使用描述性标题。</li><li>必要时补一张截图。</li><li>记录最终有效的解决方法。</li></ul>`,6),
ns('a8','Docker 操作速查','开发工具','command',['Docker','命令'],`<h2>查看运行容器</h2><pre><code>docker ps</code></pre><h2>查看全部容器</h2><pre><code>docker ps -a</code></pre><h2>查看日志</h2><pre><code>docker logs --tail 100 容器名</code></pre>`,7)
],pasteMode:'rich',theme:'light'};}
let data;try{let stored=JSON.parse(localStorage.getItem(DB)||'null');data=stored&&Array.isArray(stored.notes)?stored:demoData()}catch(e){data=demoData()}
let page='home',active='all',typeFilter='all',noteId=null,edit=false,editingDraft=null,autoTimer=null,toastTimer=null;
let storageWarningShown=false;function persist(){try{localStorage.setItem(DB,JSON.stringify(data));return true}catch(err){if(!storageWarningShown){storageWarningShown=true;toast('当前浏览器禁止本地持久保存；修改仅本次有效，请导出备份')}return true}}
function safeUrl(u,img=false){let s=String(u||'').trim();if(img)return /^https?:\/\//i.test(s)||/^data:image\/(png|jpeg|webp|gif);base64,/i.test(s);return /^(https?:\/\/|mailto:|#|\/)/i.test(s)}
const allowed=new Set('p div span b strong i em u s strike del mark small sub sup h1 h2 h3 h4 h5 h6 ul ol li blockquote pre code br hr a img figure figcaption table thead tbody tfoot tr th td caption details summary section article'.split(' '));
function cleanHTML(html,keepStyles=true){const input=new DOMParser().parseFromString(String(html),'text/html');const output=document.createElement('div');const discarded=new Set('script style iframe object embed form input button textarea select option svg math meta link base video audio canvas noscript template'.split(' '));let nodeCount=0;
function copy(node,parent){if(++nodeCount>20000)return;if(node.nodeType===3){parent.appendChild(document.createTextNode(node.textContent||''));return}if(node.nodeType!==1)return;let tag=node.tagName.toLowerCase();if(discarded.has(tag))return;let el=allowed.has(tag)?document.createElement(tag):document.createElement('span');if(tag==='a'){let href=node.getAttribute('href');if(safeUrl(href))el.setAttribute('href',href);el.setAttribute('rel','noopener noreferrer');el.setAttribute('target','_blank')}
if(tag==='img'){let src=node.getAttribute('src');if(!safeUrl(src,true))return;el.setAttribute('src',src);el.setAttribute('alt',(node.getAttribute('alt')||'').slice(0,200));el.setAttribute('loading','lazy');el.setAttribute('referrerpolicy','no-referrer')}
if(keepStyles){let st=node.style;const white=['color','background-color','font-weight','font-style','text-decoration','text-align','font-size','margin-left','vertical-align'];for(let k of white){let v=st.getPropertyValue(k);if(v&&v.length<70&&!/url\s*\(|expression|@import|[<>]/i.test(v)){if(k==='font-size'&&!/^(\d{1,2}(px|pt)|[0-9.]{1,4}(em|rem)|\d{2,3}%)$/.test(v.trim()))continue;el.style.setProperty(k,v)}}}
if(tag==='td'||tag==='th'){for(let k of ['colspan','rowspan']){let val=Number(node.getAttribute(k));if(Number.isInteger(val)&&val>=1&&val<=20)el.setAttribute(k,String(val))}}
if(tag==='pre'){el.className='pasted-code'}if(tag==='div'&&node.classList.contains('callout')){el.className='callout';if(node.classList.contains('warn'))el.classList.add('warn');if(node.classList.contains('good'))el.classList.add('good')}
for(let n of node.childNodes)copy(n,el);parent.appendChild(el)}
for(let n of input.body.childNodes)copy(n,output);return output.innerHTML}
function nowString(t){return new Date(t).toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'})};const fullDate=t=>new Date(t).toLocaleDateString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'});
function closeMenu(){document.body.classList.remove('menu-open')};function categoryOptions(curr){return [...new Set(['未分类',...data.categories,curr].filter(Boolean))].map(x=>`<option value="${esc(x)}" ${curr===x?'selected':''}>${esc(x)}</option>`).join('')}

const surf=$('#editorSurface');surf.addEventListener('input',()=>{updateDraftFromDOM();scheduleSave();if(surf.textContent.endsWith('/'))openSlashHint()});surf.addEventListener('paste',pasteRich);surf.addEventListener('keydown',e=>{if(e.key!=='/'||e.isComposing||e.ctrlKey||e.metaKey)return;const sel=window.getSelection();let anchor=sel?.anchorNode;let parent=anchor?.nodeType===1?anchor:anchor?.parentElement;if(parent?.closest('pre,code'))return;let before=anchor?.nodeType===3?(anchor.textContent||'').slice(0,sel.anchorOffset):'';if(before.trim())return;e.preventDefault();openSlashMenu()});

function createNew(type='note'){if(edit)saveDraft(true);let id='n'+Date.now()+Math.random().toString(36).slice(2,6);let n={id,title:'',type,category:active&&!['all','recent','pinned'].includes(active)?active:'未分类',tags:[],body:type==='command'?'<h2>用途</h2><p></p><h2>命令</h2><pre><code>在这里输入命令</code></pre>':type==='issue'?'<h2>问题现象</h2><p></p><h2>解决办法</h2><p></p><h2>排查过程</h2><p></p>':'',source:'',created:Date.now(),updated:Date.now(),pinned:false};data.notes.unshift(n);persist();noteId=id;edit=true;editingDraft=JSON.parse(JSON.stringify(n));page='note';closeMenu();render();window.scrollTo(0,0);setTimeout(()=>$('#editTitle')?.focus(),100)}
function updateDraftFromDOM(){if(!edit||!editingDraft||!$('#editTitle'))return;let n=editingDraft;n.title=$('#editTitle').value;n.type=$('#editType').value;n.category=$('#editCategory').value;n.tags=$('#editTags').value.split(/[,，]/).map(s=>s.trim().replace(/^#/,'')).filter(Boolean).slice(0,30);n.source=$('#editSource').value;n.body=cleanHTML($('#editorSurface').innerHTML,true);n.updated=Date.now();$('#saveStatus').textContent='● 待自动保存'}
function saveDraft(quiet=false){if(!edit||!editingDraft)return true;if($('#editTitle'))updateDraftFromDOM();let n=editingDraft;n.title=n.title.trim()||'无标题笔记';let idx=data.notes.findIndex(x=>x.id===n.id);if(idx>=0)data.notes[idx]=JSON.parse(JSON.stringify(n));if(!data.categories.includes(n.category)&&n.category!=='未分类')data.categories.push(n.category);let ok=persist();if($('#saveStatus'))$('#saveStatus').textContent=ok?'✓ 已自动保存':'保存失败';if(!quiet)toast(ok?'笔记已保存':'保存失败，请导出备份');return ok}

function openSlashMenu(){const menu=$('#slashMenu');let selection=window.getSelection(),rect=selection.rangeCount?selection.getRangeAt(0).getBoundingClientRect():null;let x=rect?.left||window.innerWidth/2,y=(rect?.bottom||120)+8;menu.style.left=Math.max(12,Math.min(x,window.innerWidth-260))+'px';menu.style.top=Math.max(12,Math.min(y,window.innerHeight-355))+'px';menu.classList.add('open')}function closeSlashMenu(){$('#slashMenu').classList.remove('open')}function openSlashHint(){openSlashMenu()}
async function storeImage(file,dest){if(!file.type.startsWith('image/'))return;const img=new Image();const url=URL.createObjectURL(file);try{await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=url});let max=1500;let ratio=Math.min(1,max/Math.max(img.width,img.height));let canvas=document.createElement('canvas');canvas.width=Math.round(img.width*ratio);canvas.height=Math.round(img.height*ratio);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);let dataUri=canvas.toDataURL('image/jpeg',.76);let html=`<figure><img src="${dataUri}" alt="${esc(file.name)}"><figcaption>${esc(file.name)}</figcaption></figure><p></p>`;if(dest==='capture'){$('#capturePad').focus();document.execCommand('insertHTML',false,html)}else insertHTML(html);toast('已插入图片（本地演示会压缩，存储容量有限）')}catch(e){toast('图片无法处理，请换一张重试')}finally{URL.revokeObjectURL(url)}}
async function pasteRich(e){const mode=(e.currentTarget.id==='capturePad'?$('#capturePasteMode')?.value:$('#editPasteMode')?.value)||'rich';let clip=e.clipboardData;if(!clip)return;let html=clip.getData('text/html'),plain=clip.getData('text/plain');const file=Array.from(clip.files||[]).find(f=>f.type.startsWith('image/'));
if(file&&!html&&!plain){e.preventDefault();await storeImage(file,e.currentTarget.id==='capturePad'?'capture':'edit');return}
if(mode==='plain'){e.preventDefault();document.execCommand('insertText',false,plain);return}
if(html){e.preventDefault();let result=cleanHTML(html,mode==='rich');document.execCommand('insertHTML',false,result);if(mode==='rich'&&/<img/i.test(html))toast('已粘贴图文；原网页的远程图片可能会失效，正式版应另存图片')}
}

async function importJSON(file){if(!file)return;try{let obj=JSON.parse(await file.text());if(!Array.isArray(obj.notes)||!Array.isArray(obj.categories))throw Error('invalid');if(obj.notes.length>10000)throw Error('too many');if(!confirm(`准备导入 ${obj.notes.length} 篇笔记，将替换当前演示笔记。建议先导出备份。确定继续？`))return;data.notes=obj.notes.filter(n=>typeof n.id==='string'&&typeof n.body==='string').map(n=>({...n,title:String(n.title||''),body:cleanHTML(n.body,true),tags:Array.isArray(n.tags)?n.tags:[],category:String(n.category||'未分类'),type:typeName[n.type]?n.type:'note',pinned:!!n.pinned,source:String(n.source||''),updated:Number(n.updated)||Date.now(),created:Number(n.created)||Date.now()}));data.categories=obj.categories.filter(x=>typeof x==='string').slice(0,300);persist();openHome();toast('备份已导入')}catch(e){toast('导入失败：不是有效的知识库 JSON 备份')}finally{$('#importFile').value=''}}
function openSearch(){$('#switcher').classList.add('open');$('#globalSearch').value='';renderSearch('');$('#globalSearch').focus()};function closeSearch(){$('#switcher').classList.remove('open')};function renderSearch(q){let arr=data.notes.filter(n=>[n.title,n.category,n.source,...(n.tags||[]),tinyText(n.body)].join(' ').toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.updated-a.updated).slice(0,18);$('#switcherList').innerHTML=arr.map(n=>`<button class="switcher-item" data-search-id="${esc(n.id)}">${esc(n.title||'无标题笔记')}<small>${esc(n.category)} · ${esc(typeName[n.type])} · ${nowString(n.updated)}</small></button>`).join('')||'<div class="empty" style="padding:25px">没有找到匹配的内容</div>'}
function toast(s){let el=$('#toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3000)}
// Delegated interaction
$('#slashMenu').addEventListener('mousedown',e=>e.preventDefault());
 document.addEventListener('click',e=>{const slash=e.target.closest('[data-slash]');if(slash){const k=slash.dataset.slash;closeSlashMenu();if(k==='h2'||k==='h3')doFormat('formatBlock',k);else if(k==='ul')doFormat('insertUnorderedList');else doInsert(k);return}if(!e.target.closest('#slashMenu'))closeSlashMenu();const nav=e.target.closest('[data-nav]');if(nav){openHome(nav.dataset.nav);return}const op=e.target.closest('[data-open]');if(op){openNote(op.dataset.open);return}const nw=e.target.closest('[data-new]');if(nw){createNew(nw.dataset.new);return}const tp=e.target.closest('[data-type]');if(tp){typeFilter=tp.dataset.type;render();return}const cl=e.target.closest('[data-close]');if(cl){$('#'+cl.dataset.close)?.classList.remove('open');return}const fmt=e.target.closest('[data-fmt]');if(fmt){doFormat(fmt.dataset.fmt);return}const ins=e.target.closest('[data-insert]');if(ins){doInsert(ins.dataset.insert);return}const sr=e.target.closest('[data-search-id]');if(sr){closeSearch();openNote(sr.dataset.searchId);return}
if(e.target.closest('#newSide'))createNew();else if(e.target.closest('#quickCapture'))openCapture();else if(e.target.closest('#quickImage')){createNew('note');setTimeout(()=>$('#imageFile').click(),250)}else if(e.target.closest('#backDoc')){if(edit){saveDraft(true);edit=false;editingDraft=null;render()}else openHome(active)}else if(e.target.closest('#editDoc')){edit=true;editingDraft=null;render()}else if(e.target.closest('#pinDoc')){let n=data.notes.find(n=>n.id===noteId);n.pinned=!n.pinned;persist();render();toast(n.pinned?'已收藏':'已取消收藏')}else if(e.target.closest('#duplicateDoc')){let n=data.notes.find(n=>n.id===noteId),copy=JSON.parse(JSON.stringify(n));copy.id='n'+Date.now();copy.title+='（副本）';copy.updated=Date.now();copy.created=Date.now();copy.pinned=false;data.notes.unshift(copy);persist();openNote(copy.id,true)}else if(e.target.closest('#deleteDoc')){if(confirm('确认删除这篇笔记吗？删除后可以通过导出的备份恢复。')){data.notes=data.notes.filter(n=>n.id!==noteId);persist();openHome();toast('笔记已删除')}}else if(e.target.closest('#saveEditor'))finishEditing();else if(e.target.closest('#viewEditor'))finishEditing();else if(e.target.closest('#addImgButton'))$('#imageFile').click();else if(e.target.closest('#captureSave'))saveCapture();else if(e.target.closest('#addCategory'))addCategory();else if(e.target.closest('#exportBtn')){closeMenu();exportJSON()}else if(e.target.closest('#importBtn')){closeMenu();$('#importFile').click()}
else if(e.target.closest('#searchTop')||e.target.closest('#mobileSearch'))openSearch();else if(e.target.closest('#themeBtn')){data.theme=data.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=data.theme;persist()}
else if(e.target.closest('#menuBtn')||e.target.closest('#mobileCats'))document.body.classList.toggle('menu-open');else if(e.target.closest('#mobileShade'))closeMenu();else if(e.target.closest('#mobileHome'))openHome();else if(e.target.closest('#mobileNew'))createNew('note');else if(!e.target.closest('#switcher')&&$('#switcher').classList.contains('open'))closeSearch();
});
$('#blockSelect')?.addEventListener('change',()=>{});
document.addEventListener('change',e=>{if(e.target.id==='blockSelect')doFormat('formatBlock',e.target.value);if(e.target.id==='fontColor')doFormat('foreColor',e.target.value);if(e.target.id==='importFile')importJSON(e.target.files[0]);if(e.target.id==='imageFile'){let files=Array.from(e.target.files||[]);(async()=>{for(let f of files)await storeImage(f,'edit')})();e.target.value=''}});
$('#capturePad').addEventListener('paste',pasteRich);$('#globalSearch').addEventListener('input',e=>renderSearch(e.target.value));
$('#captureOverlay').addEventListener('click',e=>{if(e.target.id==='captureOverlay')closeCapture()});
document.addEventListener('keydown',e=>{let cmd=e.metaKey||e.ctrlKey;if(cmd&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(cmd&&e.key.toLowerCase()==='s'&&edit){e.preventDefault();saveDraft();}if(e.key==='Escape'){closeSearch();closeCapture();closeMenu();closeSlashMenu()}if(e.key==='Enter'&&e.target.closest('.note-card'))openNote(e.target.closest('.note-card').dataset.open)});
document.documentElement.dataset.theme=data.theme==='dark'?'dark':'light';render();
})();
</script>
</body>
</html>
